name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare optional release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CPAMP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CPAMP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CPAMP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CPAMP_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "RELEASE_SIGNING=unsigned" >> "$GITHUB_ENV"
            exit 0
          fi
          key_path="$RUNNER_TEMP/cpamp-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_path"
          echo "CPAMP_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
          echo "CPAMP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CPAMP_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CPAMP_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_SIGNING=signed" >> "$GITHUB_ENV"

      - name: Verify and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cpamp-mobile-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cpamp-mobile-release-${{ env.RELEASE_SIGNING }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

