name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Prepare optional release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CPAMP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CPAMP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CPAMP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CPAMP_KEY_PASSWORD }}
        run: |
          configured=0
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -n "${!value}" ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ "$configured" -eq 0 ]]; then
            echo "RELEASE_SIGNING=unsigned" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ "$configured" -ne 4 ]]; then
            echo "Release signing secrets must be configured together" >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/cpamp-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_path"
          echo "CPAMP_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
          echo "CPAMP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CPAMP_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CPAMP_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_SIGNING=signed" >> "$GITHUB_ENV"

      - name: Verify and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cpamp-mobile-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cpamp-mobile-release-${{ env.RELEASE_SIGNING }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Require release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CPAMP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CPAMP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CPAMP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CPAMP_KEY_PASSWORD }}
        run: |
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Missing required signing secret: $value" >&2
              exit 1
            fi
          done
          key_path="$RUNNER_TEMP/cpamp-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_path"
          echo "CPAMP_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
          echo "CPAMP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CPAMP_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CPAMP_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify tag matches app version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $app_version" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$app_version" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew assembleRelease

      - name: Prepare release assets and notes
        shell: bash
        run: |
          source_apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          if [[ -z "$source_apk" ]]; then
            echo "Signed release APK not found" >&2
            exit 1
          fi
          mkdir -p release-assets
          apk_name="cpamp-mobile-v${RELEASE_VERSION}.apk"
          cp "$source_apk" "release-assets/$apk_name"
          (cd release-assets && sha256sum "$apk_name" > "$apk_name.sha256")
          apk_size="$(du -h "release-assets/$apk_name" | cut -f1)"
          apk_sha="$(cut -d' ' -f1 "release-assets/$apk_name.sha256")"
          cp "docs/release-notes/v${RELEASE_VERSION}.md" release-body.md
          {
            printf '\n## Release integrity / 发布完整性\n\n'
            printf -- '- Signed APK / 已签名 APK: `%s`\n' "$apk_name"
            printf -- '- Size / 大小: `%s`\n' "$apk_size"
            printf -- '- SHA-256: `%s`\n' "$apk_sha"
            printf -- '- Full changelog / 完整变更: https://github.com/%s/compare/v1.0.1...%s\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
          } >> release-body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CPAMP Mobile ${{ env.RELEASE_VERSION }}
          body_path: release-body.md
          files: |
            release-assets/cpamp-mobile-v${{ env.RELEASE_VERSION }}.apk
            release-assets/cpamp-mobile-v${{ env.RELEASE_VERSION }}.apk.sha256
          fail_on_unmatched_files: true
          make_latest: true

