name: Android PR
run-name: Android PR / #${{ github.event.number }}

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime

      - name: Summarize dependency review
        if: always()
        run: |
          {
            echo "## PR dependency security"
            echo "- Pull request: #${{ github.event.number }}"
            echo "- Policy: reject new high or critical runtime vulnerabilities"
          } >> "$GITHUB_STEP_SUMMARY"

  validation:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run debug checks
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Upload debug reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-reports-${{ github.run_number }}-${{ github.sha }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize PR validation
        if: always()
        run: |
          {
            echo "## PR validation"
            echo "- Pull request: #${{ github.event.number }}"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Tasks: unit tests and Debug lint"
            echo "- APK build: disabled"
          } >> "$GITHUB_STEP_SUMMARY"