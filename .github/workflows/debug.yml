name: Android Debug
run-name: Android Debug / ${{ github.ref_name }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Test, lint and signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Require debug signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CPAMP_DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CPAMP_DEBUG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CPAMP_DEBUG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CPAMP_DEBUG_KEY_PASSWORD }}
        run: |
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Missing required debug signing secret: $value" >&2
              exit 1
            fi
          done
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          key_path="$RUNNER_TEMP/cpamp-debug.keystore"
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$key_path"; then
            echo "CPAMP_DEBUG_KEYSTORE_BASE64 is not valid base64" >&2
            exit 1
          fi
          chmod 600 "$key_path"
          if [[ ! -s "$key_path" ]]; then
            echo "Decoded debug keystore is empty" >&2
            exit 1
          fi
          if ! keytool -list \
            -keystore "$key_path" \
            -storepass "$KEYSTORE_PASSWORD" > /dev/null; then
            echo "Unable to open decoded debug keystore; check CPAMP_DEBUG_KEYSTORE_BASE64 and CPAMP_DEBUG_KEYSTORE_PASSWORD" >&2
            exit 1
          fi
          if ! keytool -list \
            -keystore "$key_path" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null; then
            echo "Debug signing alias was not found; check CPAMP_DEBUG_KEY_ALIAS" >&2
            exit 1
          fi
          echo "CPAMP_DEBUG_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
          echo "CPAMP_DEBUG_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CPAMP_DEBUG_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CPAMP_DEBUG_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run debug checks
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build signed debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk-${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-reports-${{ github.run_number }}-${{ github.sha }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize debug pipeline
        if: always()
        run: |
          {
            echo "## Debug validation"
            echo "- Ref: $GITHUB_REF_NAME"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Tasks: unit tests, Debug lint, signed Debug APK"
            echo "- Release publishing: disabled"
          } >> "$GITHUB_STEP_SUMMARY"